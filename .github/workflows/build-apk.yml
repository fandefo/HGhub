name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NDK_VERSION: "27.2.12479018"

    steps:
      - name: 下载代码
        uses: actions/checkout@v4

      - name: 装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 缓存 Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 装 Android SDK
        uses: android-actions/setup-android@v4

      - name: 装 NDK
        run: |
          sdkmanager --install "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: 初始化 Tauri 安卓工程
        run: pnpm tauri android init

      - name: 编译 APK
        run: pnpm tauri android build --apk --debug --target aarch64

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: hghub-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
