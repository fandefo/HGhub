name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 装 pnpm
        run: npm install -g pnpm@latest

      - name: 装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 装 Android SDK
        uses: android-actions/setup-android@v4

      - name: 装 NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: 安装依赖
        run: pnpm install

      - name: 初始化 Tauri 安卓工程
        run: pnpm tauri android init

      - name: 编译 APK (Debug)
        run: pnpm tauri android build --apk --debug --target aarch64

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: hghub-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
